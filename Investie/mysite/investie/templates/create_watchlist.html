<script src="https://cdn.tailwindcss.com"></script>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Watchlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <div class="max-w-7xl mx-auto p-8">
        <h1 class="text-3xl font-bold mb-6">Create Your Watchlist</h1>

        <form method="post" class="bg-white p-6 rounded-xl shadow-md">
            {% csrf_token %}

            <div class="grid grid-cols-2 gap-8">
                <div>
                    <h2 class="text-xl font-semibold mb-4">Available Stocks</h2>
                    <div class="overflow-y-scroll max-h-[400px] border border-gray-300 rounded-md">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-200 text-gray-700 sticky top-0">
                                <tr>
                                    <th class="p-2">Symbol</th>
                                    <th class="p-2">Name</th>
                                    <th class="p-2">Add</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for ticker in tickers %}
                                    <tr class="hover:bg-gray-100 border-b">
                                        <td class="p-2 font-medium">{{ ticker.symbol }}</td>
                                        <td class="p-2">{{ ticker.name }}</td>
                                        <td class="p-2">
                                            <button type="button" onclick="addTicker('{{ ticker.symbol }}')" class="text-green-600 hover:text-green-800">➕</button>
                                        </td>
                                    </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>

                <div>
                    <h2 class="text-xl font-semibold mb-4">Your Watchlist</h2>
                    <div id="selected-tickers" class="border border-gray-300 rounded-md min-h-[400px] p-4 bg-gray-50 space-y-2">
                    </div>
                    <input type="hidden" name="watchlist" id="watchlist-input">
                </div>
            </div>

            <div class="mt-6 text-right">
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                    Save Watchlist
                </button>
            </div>
        </form>
    </div>

    <script>
        let selected = [];

        function addTicker(ticker) {
            if (!selected.includes(ticker)) {
                selected.push(ticker);
                updateUI();
            }
        }

        function removeTicker(ticker) {
            selected = selected.filter(t => t !== ticker);
            updateUI();
        }

        function updateUI() {
            const container = document.getElementById("selected-tickers");
            container.innerHTML = "";

            selected.forEach(ticker => {
                const div = document.createElement("div");
                div.className = "flex justify-between items-center bg-white p-2 rounded-md shadow-sm";
                div.innerHTML = `
                    <span>${ticker}</span>
                    <button type="button" onclick="removeTicker('${ticker}')" class="text-red-500 hover:text-red-700"> X </button>
                `;
                container.appendChild(div);
            });

            document.getElementById("watchlist-input").value = JSON.stringify(selected);
        }
    </script>

</body>
</html>
