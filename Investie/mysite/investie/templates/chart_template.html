<script src="https://cdn.tailwindcss.com"></script>
<!DOCTYPE html>
 <html>
 <head>
     <title>Chart.js Example</title>
     <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
 </head>
 <style>
  .toolbar {
    background-color: #2c3e50;
    color: white;
    padding: 10px 20px;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .toolbar h1 {
    margin: 0;
    font-size: 1.5em;
  }

  .toolbar nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    font-weight: 500;
  }

  .toolbar nav a:hover {
    text-decoration: underline;
  }
</style>

 <body>
 <div class="toolbar">
  <h1>📊 MyStockTracker</h1>
  <nav>
    <a href="/">Home</a>
      <a href="/stock_prices/">Analysis</a>
    <a href="/about/">About</a>
    <a href="/contact/">Contact</a>
      <a href="/watchlists/">Watchlists</a>
  </nav>
</div>
 <p id="stock-price">Current Price: Loading...</p>
 <select id="ticker-select" onchange="fetchPrice()">
     {% for ticker in tickers %}
        <option value="{{ ticker.symbol }}">{{ ticker.name }} ({{ ticker.symbol }})</option>
    {% endfor %}
     </select>

     <canvas id="myChart" width="400" height="200"></canvas>
     <script>
         function fetchPrice() {
    var ticker = document.getElementById('ticker-select').value;
    fetch(`get_live_price/?ticker=${ticker}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById('stock-price').innerText = `Current Price: $${data.current_price} last updated @ ${data.last_updated}`;
            myChart.data.labels = data.chart_labels;
myChart.data.datasets[0].data = data.chart_data;
myChart.update();
        });
}

        fetchPrice();
        setInterval(fetchPrice, 30000);
         const ctx = document.getElementById('myChart').getContext('2d');
         const data = {{ data|safe }};
         const myChart = new Chart(ctx, {
             type: 'line',
             data: {
                 labels: data.labels,
                 datasets: [{
                     label: 'My First Dataset',
                     data: data.data,
                     borderColor: 'rgba(75, 192, 192, 1)',
                     borderWidth: 1
                 }]
             }
         });
     </script>
 </body>


 </html>
