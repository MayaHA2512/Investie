name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.13.2]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    
    # Install dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Investie/mysite/requirements.txt
    
    # Print Python version and installed packages for debugging
    - name: Check Python version and installed packages
      run: |
        python --version
        pip freeze

    # Change directory to where manage.py is located and apply migrations
    - name: Apply Migrations
      run: |
        cd Investie/mysite
        python manage.py migrate

    # Run tests with increased verbosity to get more debug information
    - name: Run Tests
      run: |
        cd Investie/mysite
        python manage.py test --verbosity=2

